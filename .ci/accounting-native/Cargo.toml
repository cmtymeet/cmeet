[package]
name = "cmeet-accounting-contract"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
cfrm = { git = "https://github.com/corbet-libs/cfrm.git", branch = "main", default-features = false, features = ["sqlite"] }
cmsg = { git = "https://github.com/corbet-libs/cmsg.git", branch = "main", default-features = false }
ed25519-dalek = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
