version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /apps/cli
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ['*']
  - package-ecosystem: npm
    directories:
      - /apps/web
      - /core
      - /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ['*']
