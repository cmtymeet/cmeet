name: Web frontend
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmeet-implementation
  queue: max
  cancel-in-progress: false
jobs:
  web-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.web }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify workflow applicability and acceptance commands
        run: node --test .ci/web-impact.test.mjs
      - id: paths
        run: node .ci/web-impact.mjs
  web:
    needs: [web-impact]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Require successful applicability and prerequisite checks
        if: needs.web-impact.result != 'success'
        working-directory: .
        run: exit 1
      - name: Scope not affected
        if: needs.web-impact.result == 'success' && needs.web-impact.outputs.relevant == 'false'
        working-directory: .
        run: echo 'Not applicable to the changed paths. No web tests or product acceptance claimed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: needs.web-impact.outputs.relevant == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: needs.web-impact.outputs.relevant == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: needs.web-impact.outputs.relevant == 'true'
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        if: needs.web-impact.outputs.relevant == 'true'
        run: npm run typecheck

      - name: Unit and component tests
        if: needs.web-impact.outputs.relevant == 'true'
        run: npm run test:unit -- --coverage

      - name: Upload web coverage reports
        if: always() && needs.web-impact.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-coverage-reports
          path: apps/web/coverage
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        if: needs.web-impact.outputs.relevant == 'true'
        run: npm run build

      - name: Verify generated browser asset closure
        if: needs.web-impact.outputs.relevant == 'true'
        run: node ../../.ci/assert-asset-closure.mjs dist

      - name: Install Playwright browser
        if: needs.web-impact.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium

      - name: UI fixture journeys (development server)
        if: needs.web-impact.outputs.relevant == 'true'
        run: npm run test:e2e

      - name: Production excludes fixtures and refuses unavailable runtime
        if: needs.web-impact.outputs.relevant == 'true'
        run: npm run test:production

      - name: Upload Playwright report
        if: (failure()) && needs.web-impact.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
