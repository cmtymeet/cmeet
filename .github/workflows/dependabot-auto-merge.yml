name: Dependabot auto-merge

on:
  workflow_run:
    workflows: [ci, Web frontend]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  enable:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Never check out, download artifacts from, or execute the proposed code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const run = context.payload.workflow_run;
            const required = ['resolve', 'check', 'dependency-policy', 'coverage', 'web', 'toy'];
            const allowed = new Map([
              ['ci', 'ci.yml'], ['Web frontend', 'web.yml']
            ]);
            const filename = allowed.get(run.name);
            if (!filename || run.path !== `.github/workflows/${filename}`) {
              throw new Error('Unexpected validation workflow');
            }
            const {data: workflow} = await github.rest.actions.getWorkflow({owner, repo, workflow_id: filename});
            if (run.workflow_id !== workflow.id) throw new Error('Workflow identity mismatch');
            for (const candidate of run.pull_requests) {
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: candidate.number});
              if (pr.user.login !== 'dependabot[bot]' || pr.state !== 'open' || pr.draft ||
                  pr.base.ref !== 'main' || pr.head.repo?.full_name !== `${owner}/${repo}` ||
                  pr.head.sha !== run.head_sha) continue;
              const {data: branch} = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
              const protection = branch.protection?.required_status_checks;
              const names = new Set(protection?.contexts || []);
              for (const check of protection?.checks || []) names.add(check.context);
              if (!branch.protected || protection?.enforcement_level !== 'everyone' ||
                  required.some(name => !names.has(name))) {
                throw new Error('Main must require every check, including for administrators');
              }
              const checks = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: pr.head.sha, filter: 'latest', per_page: 100
              });
              // The sibling workflow may still be running. Its completion retries this check.
              if (required.some(name => !checks.some(check => check.name === name &&
                    check.app?.slug === 'github-actions' && check.conclusion === 'success')) ||
                  checks.some(check => check.status !== 'completed' || check.conclusion !== 'success')) continue;
              const {data: status} = await github.rest.repos.getCombinedStatusForRef({owner, repo, ref: pr.head.sha});
              if (status.total_count && status.state !== 'success') continue;
              const {data: current} = await github.rest.pulls.get({owner, repo, pull_number: pr.number});
              if (current.head.sha !== run.head_sha || current.state !== 'open' ||
                  current.base.sha !== branch.commit.sha || current.mergeable_state !== 'clean') continue;
              const {data: result} = await github.rest.pulls.merge({owner, repo,
                pull_number: current.number, sha: current.head.sha, merge_method: 'squash'});
              if (!result.merged) throw new Error('Protected merge refused');
            }
