name: Release image native runtime contract
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful reviewed website source-preparation run
        type: string
        required: true
      package_source_sha:
        description: Exact original cmeet commit of that preparation
        type: string
        required: true
      export_archive:
        description: Retain the checked image as a file for deployment
        type: boolean
        default: false
      export_bundle:
        description: Retain a pinned Docker build context for external builders
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: cmeet-implementation
  queue: max
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
      image_id: ${{ steps.build.outputs.image_id }}
    env:
      CI_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      REUSE_SOURCE_RUN: ${{ inputs.package_run_id }}
      REUSE_SOURCE_SHA: ${{ inputs.package_source_sha }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build and check the isolated runtime image
        id: build
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/image-contract
          EXPORT_IMAGE_ARCHIVE: ${{ inputs.export_archive }}
          IMAGE_ARCHIVE_DIR: ${{ runner.temp }}/image-archive
          EXPORT_BUILD_BUNDLE: ${{ inputs.export_bundle }}
          BUILD_BUNDLE_DIR: ${{ runner.temp }}/image-bundle
        run: bash .ci/image-checks.sh
      - name: Retain the verified Docker build context
        if: inputs.export_bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/image-bundle
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain the exact checked image archive
        if: inputs.export_archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-archive-${{ github.sha }}
          path: ${{ runner.temp }}/image-archive
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain public provenance and bounded runtime report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-contract-${{ github.sha }}
          path: ${{ runner.temp }}/image-contract
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
