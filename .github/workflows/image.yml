name: Release image native runtime contract
on:
  workflow_dispatch:
    inputs:
      package_run_id:
        description: Successful reviewed website source-preparation run
        type: string
        required: true
      package_source_sha:
        description: Exact original cmeet commit of that preparation
        type: string
        required: true
      publish_image:
        description: Publish the successfully checked image to GHCR
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      archive_sha256: ${{ steps.build.outputs.archive_sha256 }}
      image_id: ${{ steps.build.outputs.image_id }}
    env:
      CI_COMMIT_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      REUSE_SOURCE_RUN: ${{ inputs.package_run_id }}
      REUSE_SOURCE_SHA: ${{ inputs.package_source_sha }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build and check the isolated runtime image
        id: build
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/image-contract
          EXPORT_IMAGE_ARCHIVE: ${{ inputs.publish_image }}
          IMAGE_ARCHIVE_DIR: ${{ runner.temp }}/image-archive
        run: bash .ci/image-checks.sh
      - name: Retain the exact checked image for publication
        if: inputs.publish_image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-archive-${{ github.sha }}
          path: ${{ runner.temp }}/image-archive
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain public provenance and bounded runtime report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-contract-${{ github.sha }}
          path: ${{ runner.temp }}/image-contract
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
  publish:
    if: inputs.publish_image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      CI_COMMIT_SHA: ${{ github.sha }}
      EXPECTED_ARCHIVE_SHA: ${{ needs.image.outputs.archive_sha256 }}
      EXPECTED_IMAGE_ID: ${{ needs.image.outputs.image_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Download this run's checked image and evidence
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_ARCHIVE_DIR: ${{ runner.temp }}/image-archive
          IMAGE_EVIDENCE_DIR: ${{ runner.temp }}/image-contract
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-archive-$CI_COMMIT_SHA" --dir "$IMAGE_ARCHIVE_DIR"
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "image-contract-$CI_COMMIT_SHA" --dir "$IMAGE_EVIDENCE_DIR"
      - name: Verify and publish the checked image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_ARCHIVE_DIR: ${{ runner.temp }}/image-archive
          IMAGE_EVIDENCE_DIR: ${{ runner.temp }}/image-contract
          ARTIFACT_ROOT: ${{ runner.temp }}/image-publication
        run: bash .ci/image-publish.sh
      - name: Retain the image digest and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-publication-${{ github.sha }}
          path: ${{ runner.temp }}/image-publication
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
