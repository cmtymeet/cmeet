name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmeet-implementation
  queue: max
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never

jobs:
  cli-impact:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.paths.outputs.cli }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify workflow applicability and acceptance commands
        run: node --test .ci/web-impact.test.mjs
      - id: paths
        run: node .ci/web-impact.mjs
  resolve:
    needs: [cli-impact]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require successful applicability and prerequisite checks
        if: needs.cli-impact.result != 'success'
        working-directory: .
        run: exit 1
      - name: Scope not affected
        if: needs.cli-impact.result == 'success' && needs.cli-impact.outputs.relevant == 'false'
        working-directory: .
        run: echo 'Not applicable to the changed paths. No cli tests or product acceptance claimed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.cli-impact.outputs.relevant == 'true'

      - name: Resolve one snapshot per Cargo root
        if: needs.cli-impact.outputs.relevant == 'true'
        run: |
          mkdir -p evidence
          rustc --version --verbose > evidence/rustc.txt
          date -u +%FT%TZ > evidence/resolved-at.txt
          : > evidence/resolved-roots.txt
          failed=0
          for root in apps/cli; do
            if cargo update --manifest-path "$root/Cargo.toml"; then
              printf '%s\n' "$root" >> evidence/resolved-roots.txt
            else
              failed=1
            fi
          done
          exit "$failed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (always()) && needs.cli-impact.outputs.relevant == 'true'
        with:
          name: dependency-snapshot
          include-hidden-files: true
          path: |
            apps/cli/Cargo.lock
            evidence/
          retention-days: 7

  dependency-policy:
    needs: [cli-impact, resolve]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful applicability and prerequisite checks
        if: needs.cli-impact.result != 'success' || needs.resolve.result != 'success'
        working-directory: .
        run: exit 1
      - name: Scope not affected
        if: needs.cli-impact.result == 'success' && needs.cli-impact.outputs.relevant == 'false'
        working-directory: .
        run: echo 'Not applicable to the changed paths. No cli tests or product acceptance claimed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          name: dependency-snapshot

      - if: needs.cli-impact.outputs.relevant == 'true'
        run: |
          python3 .ci/policy/check-first-party.py
          python3 .ci/policy/test-source-coverage.py

  check:
    needs: [cli-impact, resolve, dependency-policy]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful applicability and prerequisite checks
        if: needs.cli-impact.result != 'success' || needs.resolve.result != 'success' || needs.dependency-policy.result != 'success'
        working-directory: .
        run: exit 1
      - name: Scope not affected
        if: needs.cli-impact.result == 'success' && needs.cli-impact.outputs.relevant == 'false'
        working-directory: .
        run: echo 'Not applicable to the changed paths. No cli tests or product acceptance claimed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          name: dependency-snapshot

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          cache-on-failure: true
          workspaces: |
            apps/cli

      - name: Stable format, lint and real tests
        if: needs.cli-impact.outputs.relevant == 'true'
        run: |
          failed=0
          for root in apps/cli; do
            if grep -Fxq -- "$root" evidence/resolved-roots.txt; then
              cargo fmt --manifest-path "$root/Cargo.toml" --check || failed=1
              cargo clippy --manifest-path "$root/Cargo.toml" --locked --all-targets -- -D warnings || failed=1
              cargo test --manifest-path "$root/Cargo.toml" --locked --all-targets --no-fail-fast || failed=1
            else
              echo "::error::Root did not resolve: $root"
              failed=1
            fi
          done
          exit "$failed"

      - name: Retain exact formatting suggestions
        if: (failure()) && needs.cli-impact.outputs.relevant == 'true'
        run: |
          for root in apps/cli; do
            if grep -Fxq -- "$root" evidence/resolved-roots.txt; then cargo fmt --manifest-path "$root/Cargo.toml"; fi
          done
          git diff > formatting.patch

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (failure()) && needs.cli-impact.outputs.relevant == 'true'
        with:
          name: formatting
          path: formatting.patch

  coverage:
    needs: [cli-impact, resolve, check]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require successful applicability and prerequisite checks
        if: needs.cli-impact.result != 'success' || needs.resolve.result != 'success' || needs.check.result != 'success'
        working-directory: .
        run: exit 1
      - name: Scope not affected
        if: needs.cli-impact.result == 'success' && needs.cli-impact.outputs.relevant == 'false'
        working-directory: .
        run: echo 'Not applicable to the changed paths. No cli tests or product acceptance claimed.'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          name: dependency-snapshot

      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          components: llvm-tools-preview

      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
        if: needs.cli-impact.outputs.relevant == 'true'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: needs.cli-impact.outputs.relevant == 'true'
        with:
          shared-key: coverage
          cache-on-failure: true
          workspaces: |
            apps/cli

      - name: Require every reachable line and branch
        if: needs.cli-impact.outputs.relevant == 'true'
        run: |
          mkdir -p coverage
          failed=0
          for root in apps/cli; do
            if grep -Fxq -- "$root" evidence/resolved-roots.txt; then
              report="coverage/$(basename "$root").json"
              if ! cargo llvm-cov --manifest-path "$root/Cargo.toml" --locked --all-targets --no-fail-fast --branch --json --output-path "$report"; then
                failed=1
                # Retain actual diagnostics after failures; the failed test exit
                # remains fatal even if the report itself can be generated.
                cargo llvm-cov report --manifest-path "$root/Cargo.toml" --branch --json --output-path "$report" || failed=1
              fi
              cargo llvm-cov report --manifest-path "$root/Cargo.toml" --branch --text --output-path "coverage/$(basename "$root").txt" || failed=1
              cargo llvm-cov report --manifest-path "$root/Cargo.toml" --branch --lcov --output-path "coverage/$(basename "$root").lcov" || failed=1
              python3 .ci/policy/check-source-coverage.py "coverage/$(basename "$root").lcov" "$report" "coverage/$(basename "$root").txt" || failed=1
            else
              echo "::error::No coverage for unresolved root: $root"
              failed=1
            fi
          done
          exit "$failed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: (always()) && needs.cli-impact.outputs.relevant == 'true'
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  toy:
    needs: [cli-impact]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require successful applicability and prerequisite checks
        if: needs.cli-impact.result != 'success'
        working-directory: .
        run: exit 1
      - name: Scope not affected
        if: needs.cli-impact.result == 'success' && needs.cli-impact.outputs.relevant == 'false'
        working-directory: .
        run: echo 'Not applicable to the changed paths. No cli tests or product acceptance claimed.'
      - name: Refuse incomplete product acceptance
        if: needs.cli-impact.outputs.relevant == 'true'
        run: |
          echo "::error::BLOCKED: the conjunctive real member/admin/root, Tor, groups and device-loss scenario is not implemented. See tests/toy/README.md."
          exit 1
