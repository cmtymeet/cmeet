name: ci

on:
  push:
    branches: [main]
    paths: ['apps/cli/**', 'native/backend/**', '.ci/accounting-native/**', '.ci/policy/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['apps/cli/**', 'native/backend/**', '.ci/accounting-native/**', '.ci/policy/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmeet-implementation
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: never

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Resolve one snapshot per Cargo root
        run: |
          mkdir -p evidence
          rustc --version --verbose > evidence/rustc.txt
          date -u +%FT%TZ > evidence/resolved-at.txt
          for root in apps/cli native/backend .ci/accounting-native; do
            if test -f "$root/Cargo.toml"; then
              cargo update --manifest-path "$root/Cargo.toml"
            fi
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-snapshot
          include-hidden-files: true
          path: |
            apps/cli/Cargo.lock
            native/backend/Cargo.lock
            .ci/accounting-native/Cargo.lock
            evidence/
          retention-days: 7
  dependency-policy:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-snapshot
      - run: python3 .ci/policy/check-first-party.py
  check:
    needs: [resolve, dependency-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-snapshot
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          cache-on-failure: true
          workspaces: |
            apps/cli
            native/backend
            .ci/accounting-native
      - name: Stable format, lint and real tests
        run: |
          for root in apps/cli native/backend .ci/accounting-native; do
            if test -f "$root/Cargo.toml"; then
              cargo fmt --manifest-path "$root/Cargo.toml" --check
              cargo clippy --manifest-path "$root/Cargo.toml" --locked --all-targets -- -D warnings
              cargo test --manifest-path "$root/Cargo.toml" --locked --all-targets
            fi
          done
      - name: Retain exact formatting suggestions
        if: failure()
        run: |
          for root in apps/cli native/backend .ci/accounting-native; do
            if test -f "$root/Cargo.toml"; then cargo fmt --manifest-path "$root/Cargo.toml"; fi
          done
          git diff > formatting.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: formatting
          path: formatting.patch
  coverage:
    needs: [resolve, check]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dependency-snapshot
      - uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@72f835688cb6c15903b796f704b01e652a2b8835 # cargo-llvm-cov
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: coverage
          cache-on-failure: true
          workspaces: |
            apps/cli
            native/backend
            .ci/accounting-native
      - name: Require every reachable line and branch
        run: |
          mkdir -p coverage
          failed=0
          for root in apps/cli native/backend .ci/accounting-native; do
            if test -f "$root/Cargo.toml"; then
              report="coverage/$(basename "$root").json"
              if cargo llvm-cov --manifest-path "$root/Cargo.toml" --locked --all-targets --branch --json --output-path "$report"; then
                cargo llvm-cov report --manifest-path "$root/Cargo.toml" --branch --text --output-path "coverage/$(basename "$root").txt" || failed=1
                python3 .ci/policy/check-coverage.py "$report" || failed=1
              else
                failed=1
              fi
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7
