[package]
name = "cmeet"
version = "0.1.0"
edition = "2024"
license = "BUSL-1.1"
publish = false
description = "Product shell for the cmsg member API"

[dependencies]
clap = { version = "4", features = ["derive"] }
cmsg = { git = "https://github.com/corbet-libs/cmsg.git", branch = "main", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
futures = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
rmcp = { version = "3", default-features = false, features = ["server"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "time", "signal", "net", "process"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "pipe"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
serde = { version = "1", features = ["derive"] }
axum = "0.8"
tempfile = "3"
