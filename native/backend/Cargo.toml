[package]
name = "cmeet-cfrm-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cmsg = { git = "https://github.com/cmtymeet/cmsg.git", rev = "1b098a60673411124252fd11ba78b4defef437d8", default-features = false }
cfrm = { git = "https://github.com/cmtymeet/cfrm.git", rev = "5628d2ce8fda926e50fdeced75c805ef58c2b568", default-features = false, features = ["discovery-valkey", "sqlite", "permit-issuer"] }
data-encoding = "2.9"
ed25519-dalek = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
