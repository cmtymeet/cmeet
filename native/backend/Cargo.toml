[package]
name = "cmeet-cfrm-backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
cmsg = { git = "https://github.com/corbet-libs/cmsg.git", branch = "main", default-features = false }
cfrm = { git = "https://github.com/corbet-libs/cfrm.git", branch = "main", default-features = false, features = ["discovery-valkey", "sqlite", "turso", "permit-issuer"] }
data-encoding = "2.9"
ed25519-dalek = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
